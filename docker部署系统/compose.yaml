name: myapp

services:
  mysql:
    container_name: mysql
    image: mysql:9.7.4
    environment:
      - MYSQL_ROOT_PASSWORD=123456
    ports:
      - 3306:3306
    volumes:
      - mysql-data:/var/lib/mysql
      - /root/system_zzj/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    networks:
      - myapp-network
  
  java:
    container_name: java
    build:
      context: ./system_zzj/backend
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    networks:
      - myapp-network
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=demo_db
      - DB_USER=demo_user
      - DB_PASSWORD=Demo@123456
    image: zzj_backend:1.0
    depends_on:
      - mysql

  nginx:
    container_name: nginx
    image: nginx:stable-alpine3.24
    ports:
      - 80:80
    networks:
      - myapp-network
    volumes:
      - ./system_zzj/frontend/dist:/usr/share/nginx/html:ro
      - ./system_zzj/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - java

  redis:
    container_name: redis
    image: 
    ports:
      - 6379:6379
    networks:
      - myapp-network

volumes:
  mysql-data: 

networks:
  myapp-network: