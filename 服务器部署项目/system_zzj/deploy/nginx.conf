# ============================================
# Nginx 配置示例（部署阶段用，先放到 /etc/nginx/conf.d/web-demo.conf）
# ============================================

server {
    listen 80;
    # 改成你的域名或服务器公网 IP
    server_name _;

    # 前端构建产物（npm run build 生成的 dist 目录内容）
    root /var/www/web-demo;
    index index.html;

    # 前端页面：单页应用，路径交给 Vue 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口：反向代理到本机的 Spring Boot
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 带 hash 的静态资源（js/css）缓存一周
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
